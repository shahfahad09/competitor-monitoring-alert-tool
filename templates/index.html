 $("#nav").innerHTML=NAV.map(([v,l,i,c])=>`<button data-v="${v}" class="${c||""}">${ic(i)}<span>${l}</span>${v==="new"?'<span class="nb" id="nb" hidden></span>':""}</button>`).join("");
 const p=$("#aipill");p.classList.toggle("on",!!ME.ai);p.querySelector("span").textContent=ME.ai?"AI engine on":"AI engine off";
 $("#auth").innerHTML=ME.protected?(ME.admin?`<button class="pill" data-act="logout">${ic("lock")} Log out (admin)</button>`:`<button class="pill" data-act="tologin">${ic("lock")} Admin login</button>`):"";
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view))}
async function go(v,o){view=v;if(o){Object.assign(F,o.f||{});OPEN=o.open||null}
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));$("#view").innerHTML=skel(3);
 api("/api/overview").then(o=>{const b=$("#nb");if(b){b.textContent=o.new_count;b.hidden=!o.new_count}});await({overview:vOver,new:vNew,articles:vArt,categories:vCats,keywords:vKw,compare:vCmp,digest:vDig,competitors:vComp,history:vHist,settings:vSet,login:()=>vLogin()})[v]();
 document.querySelectorAll("[data-n]").forEach(cu)}
const weekly=ps=>{const now=Date.now(),a=Array(12).fill(0);for(const p of ps){const t=Date.parse(p.published);if(!t)continue;const w=Math.floor((now-t)/6048e5);if(w>=0&&w<12)a[11-w]++}return a};
const spark=a=>{const w=300,h=100,m=Math.max(...a,1),pt=a.map((v,i)=>[i*w/11,h-8-(v/m)*(h-18)]),d=pt.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
 return `<svg viewBox="0 0 ${w} ${h}" class="spark" preserveAspectRatio="none"><defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8b7bff" stop-opacity=".4"/><stop offset="1" stop-color="#8b7bff" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h}Z" fill="url(#sg)"/><path d="${d}" fill="none" stroke="#8b7bff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>`};
const donut=m=>{const e=Object.entries(m).sort((a,b)=>b[1]-a[1]),t=e.reduce((s,x)=>s+x[1],0)||1,R=40,C=2*Math.PI*R;let off=0;
 const sg=e.map(([c,n])=>{const l=n/t*C,s=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="hsl(${hue(c)} 70% 58%)" stroke-width="15" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l;return s}).join("");
 return `<div style="display:flex;gap:18px;align-items:center"><svg viewBox="0 0 120 120" class="donut">${sg}<text x="60" y="60" text-anchor="middle" class="dn">${t}</text><text x="60" y="74" text-anchor="middle" class="dl">articles</text></svg><div class="legend">${e.slice(0,6).map(([c,n])=>`<div><i style="background:hsl(${hue(c)} 70% 58%)"></i><span>${esc(c)} · ${n}</span></div>`).join("")}</div></div>`};
async function vOver(){const[o,ps,cs,all]=await Promise.all([api("/api/overview"),api("/api/posts?new=1&limit=5"),api("/api/categories"),api("/api/posts?limit=5000")]);

 $("#view").innerHTML=head("Overview",o.last_scan?`Last scan ${dt(o.last_scan)}`:"Scan your first competitor above to get started.")+`<div class="stats">${st.map(s=>`<div class="card stat"><div class="si">${ic(s[2])}</div><b data-n="${s[0]}">0</b><span>${s[1]}</span></div>`).join("")}</div>

async function vKw(){const k=await api("/api/keywords");
 $("#view").innerHTML=head(`Keywords <small>(${k.length})</small>`,"Target keyword of every article. Click a row to see which articles use it.")+(k.length?tbl(["Keyword","Volume","Articles","Companies"],k.map(x=>`<tr class="row" data-act="kw" data-k="${esc(x.keyword)}"><td><b>${esc(x.keyword)}</b></td><td>${meter(x)}</td><td>${x.n}</td><td>${esc(x.domains)}</td></tr>`).join("")):empty("No keywords yet.","tag"));
 if(OPEN){const r=[...document.querySelectorAll("tr.row")].find(t=>t.dataset.k===OPEN);OPEN=null;r&&r.click()}}
const dual=(l,x,y)=>{const m=Math.max(x||0,y||0,1);return `<div class="dual"><div>${l}</div><div class="db"><div class="bl"><b>${x??"-"}</b><div class="t"><i style="width:${(x||0)/m*100}%"></i></div></div><div class="bl r"><b>${y??"-"}</b><div class="t"><i style="width:${(y||0)/m*100}%"></i></div></div></div></div>`};
const txt=(l,x,y)=>`<div class="dual"><div>${l}</div><div class="db"><div>${x}</div><div>${y}</div></div></div>`;
const chips=l=>l&&l.length?`<div class="chips">${l.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>`:"<small>No clear gap found yet.</small>";
const aiBox=(d,id)=>d&&d.text?`<div class="aic" id="${id}">${md(d.text)}<small style="display:block;margin-top:14px">Generated ${dt(d.ts)}</small></div>`:`<div class="empty" id="${id}">${ic("spark","")}<div>No AI analysis saved yet.</div></div>`;
async function vCmp(){const o=await api("/api/overview"),ds=o.competitors.map(c=>c.domain);
 if(ds.length<2)return $("#view").innerHTML=head("Compare","Put two companies side by side.")+empty("Scan at least two companies (one can be your own) to compare them.","cmp");
 const a0=ds.includes(o.my_domain)?o.my_domain:ds[0],b0=ds.find(d=>d!==a0),op=v=>ds.map(d=>`<option ${d===v?"selected":""}>${esc(d)}</option>`).join("");
 $("#view").innerHTML=head("Compare","Output, topics, gaps and AI strategy for two companies.")+`<div class="bar"><select id="ca">${op(a0)}</select><select id="cb">${op(b0)}</select></div><div id="cr">${skel(2)}</div>`;
 const run=async()=>{const A=$("#ca").value,B=$("#cb").value;if(A===B)return $("#cr").innerHTML=empty("Pick two different companies.","cmp");
  const[r,ins]=await Promise.all([api(`/api/compare?a=${encodeURIComponent(A)}&b=${encodeURIComponent(B)}`),api(`/api/ai/insights?a=${encodeURIComponent(A)}&b=${encodeURIComponent(B)}`)]);
  if(r.error)return $("#cr").innerHTML=empty(esc(r.error),"cmp");const a=r.a,b=r.b,me=d=>d===o.my_domain?'<span class="mine">me</span>':"";
  const all=[...new Set([...Object.keys(a.cats),...Object.keys(b.cats)])].sort((x,y)=>((b.cats[y]||0)+(a.cats[y]||0))-((b.cats[x]||0)+(a.cats[x]||0)));
  const pc=(c,s)=>Math.round((s.cats[c]||0)/(s.total||1)*100);
  $("#cr").innerHTML=`<div class="vs"><div class="card co">${av(a.domain)}<h2>${esc(a.domain)}${me(a.domain)}</h2></div><div class="vsb">VS</div><div class="card co">${av(b.domain)}<h2>${esc(b.domain)}${me(b.domain)}</h2></div></div>
  <div class="card">${dual("Articles stored",a.total,b.total)}${dual("Published, last 30 days",a.last30,b.last30)}${dual("Posts per month",a.per_month,b.per_month)}${dual("Avg search volume",a.avg_volume,b.avg_volume)}${dual("Avg demand (est.)",a.avg_demand,b.avg_demand)}${txt("Latest article",esc(a.latest||"-"),esc(b.latest||"-"))}${txt("Top topic",cat(a.top_cat),cat(b.top_cat))}${txt("Prices seen",esc(a.prices.join(", ")||"-"),esc(b.prices.join(", ")||"-"))}</div>
  <h3 class="sh">${ic("grid")} Topic mix</h3><div class="card">${all.map(c=>`<div class="dual"><div>${esc(c)}</div><div class="db"><div class="bl"><b>${pc(c,a)}%</b><div class="t track" style="--h:${hue(c)}"><i style="width:${pc(c,a)}%"></i></div></div><div class="bl r"><b>${pc(c,b)}%</b><div class="t track" style="--h:${hue(c)}"><i style="width:${pc(c,b)}%"></i></div></div></div></div>`).join("")}</div>
  <h3 class="sh">${ic("tag")} Content gaps</h3><div class="grid"><div class="card"><p><b>${esc(b.domain)}</b> covers, <b>${esc(a.domain)}</b> doesn't</p>${chips(r.b_not_a)}</div><div class="card"><p><b>${esc(a.domain)}</b> covers, <b>${esc(b.domain)}</b> doesn't</p>${chips(r.a_not_b)}</div></div>
  <h3 class="sh">${ic("spark")} AI strategy brief ${ME.admin?`<button class="btn ai s" id="gi">✦ ${ins.text?"Regenerate":"Generate"}</button>`:""}</h3>${aiBox(ins,"ib")}`;
  const g=$("#gi");if(g)g.onclick=async()=>{g.disabled=true;g.textContent="✦ Thinking…";const x=await post("/api/ai/insights",{a:A,b:B});if(x.error){toast(esc(x.error),"bad");g.disabled=false;g.textContent="✦ Generate";return}$("#ib").outerHTML=aiBox(x,"ib");g.disabled=false;g.textContent="✦ Regenerate"}};
 $("#ca").onchange=$("#cb").onchange=run;run()}

 $("#view").innerHTML=head("Weekly digest","An AI-written summary of what competitors did in the last 7 days.",ME.admin?`<button class="btn ai s" id="gd">✦ ${d.text?"Regenerate":"Generate"}</button><button class="btn g s" id="sd">Send to Slack / email</button>`:"")+`<div id="db">${aiBox(d,"dbx")}</div>`;
 const g=$("#gd");if(!g)return;g.onclick=async()=>{g.disabled=true;g.textContent="✦ Writing…";const x=await post("/api/ai/digest");g.disabled=false;g.textContent="✦ Regenerate";if(x.error)return toast(esc(x.error),"bad");$("#dbx").outerHTML=aiBox(x,"dbx")};

 $("#view").innerHTML=head(`Companies <small>(${o.competitors.length})</small>`,"Mark one as your own to use it as the baseline in Compare.")+(o.competitors.length?`<div class="grid">${o.competitors.map(c=>`<div class="card"><div style="display:flex;gap:12px;align-items:center;margin-bottom:14px">${av(c.domain)}<div><h3>${esc(c.domain)}${c.domain===o.my_domain?'<span class="mine">my company</span>':""}</h3><p style="margin:0">${c.posts} articles · scanned ${dt(c.last_scan)}</p></div></div><button class="btn s adm" data-act="rescan" data-d="${esc(c.domain)}">Rescan</button><button class="btn g s" data-act="viewcomp" data-d="${esc(c.domain)}">Articles</button>${c.domain===o.my_domain?"":`<button class="btn g s adm" data-act="mine" data-d="${esc(c.domain)}">This is my company</button>`}<button class="btn r s adm" data-act="delcomp" data-d="${esc(c.domain)}">Delete</button></div>`).join("")}</div>`:empty("No companies yet.","build"))}

function vLogin(m){$("#view").innerHTML=head("Admin login",m||"Log in to scan companies, change settings and use AI features.")+`<form class="card form" id="lf"><div><label>Admin password</label><input type="password" id="pw" autocomplete="current-password" required></div><div><button class="btn">Log in</button></div></form>`;

async function vSet(){if(!ME.admin)return vLogin("Settings are private to the site owner.");const s=await api("/api/settings");if(s.error)return vLogin(s.error);

 <div class="card sec"><h3>${ic("spark")} AI engine</h3>${f("gemini_key","Gemini API key","AIzaSy...","password","Powers smart categories, keywords, summaries, strategy briefs and the weekly digest. Get one at aistudio.google.com.")}</div>
 <div class="card sec"><h3>${ic("chart")} Search volume (use one)</h3>${f("dataforseo_login","DataForSEO login (email)","you@email.com")}${f("dataforseo_password","DataForSEO API password","","password","Find it in your DataForSEO dashboard under API access.")}${f("kwe_key","or Keywords Everywhere API key","","password")}</div>
 <div class="card sec"><h3>${ic("mail")} Alerts</h3>${f("slack_webhook","Slack webhook URL","https://hooks.slack.com/services/...","password")}${f("alert_email","Alert email","you@gmail.com","text","Email also needs the SMTP_* environment variables (see README).")}</div>
 <div><button class="btn">Save settings</button></div></form>
 <h3 class="sh">Refresh stored data</h3><div class="card"><p style="margin:0 0 12px">After adding keys, re-run AI, volume and categories on your stored articles (latest 400).</p><button class="btn g" data-act="reanalyze">Re-analyze articles</button></div>`;
 $("#sf").onsubmit=async e=>{e.preventDefault();const r=await post("/api/settings",Object.fromEntries(new FormData(e.target)));if(r.error)return toast(esc(r.error),"bad");toast("Settings saved","ok");await loadMe();go("settings")}}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,D=t.dataset;
 if(a==="delpost"){if(!confirm("Delete this article? It won't be reported as new again."))return;await del("/api/post",{url:D.url});go(view)}
 else if(a==="delcomp"){if(!confirm("Delete "+D.d+" and ALL its articles and history?"))return;await del("/api/competitor/"+encodeURIComponent(D.d));go(view)}

 else if(a==="catjump")go("articles",{f:{d:D.d,c:D.c,q:""}});
 else if(a==="kwjump")go("keywords",{open:D.k});
 else if(a==="tologin")go("login");
 else if(a==="logout"){await post("/api/logout");await loadMe();go("overview")}
 else if(a==="reanalyze"){t.disabled=true;toast("Re-analyzing. This can take a minute.");const j=await post("/api/reanalyze");if(j.error){t.disabled=false;return toast(esc(j.error),"bad")}const s=await waitJob(j.job);t.disabled=false;const r=s.result;toast(`${r.count} articles updated.<br>${esc(r.ai)}<br>Volume: ${esc(r.status)}`,r.status.startsWith("ok")?"ok":"");await loadMe()}
 else if(a==="kw"){const n=t.nextElementSibling;if(n&&n.classList.contains("ex")){n.remove();return}
  const tr=document.createElement("tr");tr.className="ex";tr.innerHTML=`<td colspan="4">Loading...</td>`;t.after(tr);const ps=await api("/api/posts?keyword="+encodeURIComponent(D.k));
  tr.firstChild.innerHTML="<ul>"+ps.map(p=>`<li><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a> <small>${esc(p.domain)}, ${esc(p.published||"no date")}</small></li>`).join("")+"</ul>"}});
async function scan(domain){if(!ME.admin)return;const b=$("#go");b.disabled=true;$("#prog").classList.add("on");say(`Scanning <b>${esc(domain)}</b>. This can take up to a minute.`);
 const j=await post("/api/check",{domain}),done=()=>{b.disabled=false;$("#prog").classList.remove("on")};if(!j.job){done();return say(esc(j.error||"Failed"),"bad")}
 const s=await waitJob(j.job);done();if(s.status==="missing")return say("Job lost (server restarted). Try again.","bad");const r=s.result;if(r.outcome!=="ok")return say(esc(r.message),"bad");
 let m=`<b>${esc(r.host)}</b>: ${r.new_posts.length} ${r.first_run?"articles stored (first scan, baseline saved)":"new article(s) found"}. <small>${esc(r.ai)}</small>`;
 if(r.pricing.change)m+=` Pricing changed: +${esc(r.pricing.change.added.join(", ")||"-")} / -${esc(r.pricing.change.removed.join(", ")||"-")}.`;
 if(r.new_posts.length&&!r.enrichment.startsWith("ok"))m+=` <small>Volume: ${esc(r.enrichment)}.</small>`;
 m+=r.alerts.map(a=>` <small>Alert (${a.channel}): ${esc(a.detail)}.</small>`).join("");say(m,"ok");if(!r.first_run&&r.new_posts.length)return go("new");go(view)}
